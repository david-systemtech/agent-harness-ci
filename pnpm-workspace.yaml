packages:
  - packages/*

# esbuild arrives through tsx and ships its binary as an optional dependency,
# so its install script is not needed. electron-winstaller (Squirrel.Windows)
# arrives as a peer of electron-builder's library; the desktop's Windows build
# is an NSIS setup (#423), so its install script is not needed either.
ignoredBuiltDependencies:
  - electron-winstaller
  - esbuild

# node-pty (the environment's pseudo-terminals, #124) needs its install
# script: it takes a prebuild where one exists (macOS, Windows) and compiles
# with node-gyp where none does (every Linux, CI's node:24-bookworm included,
# which carries python3, make and g++).
onlyBuiltDependencies:
  - node-pty

# pdf.js (web_read's PDF text, #546) names @napi-rs/canvas as an optional
# dependency for rendering pages to pixels, a native package per platform;
# web_read only reads a PDF's text, so it is not installed.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"

# Capture Windows console processes before closing their PTY (#2029).
patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
