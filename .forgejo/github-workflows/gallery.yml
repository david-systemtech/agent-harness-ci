# Install on the relay repository's workflows branch as .github/workflows/gallery.yml.
name: gallery
run-name: gallery ${{ github.event.client_payload.sha }} ${{ github.event.client_payload.id }}
on:
  repository_dispatch:
    types: [gallery]
concurrency:
  group: gallery-${{ github.event.client_payload.group }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check the payload
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: |
          if [ -f packages/gui/gallery/plan.ts ]; then
            pnpm --filter @agent-harness/gui exec tsx --conditions=@agent-harness/source gallery/plan.ts > "$RUNNER_TEMP/gallery-plan-output"
          elif [ -f packages/gui/gallery/shards.ts ]; then
            shards=$(pnpm --filter @agent-harness/gui exec tsx --conditions=@agent-harness/source gallery/shards.ts)
            python3 -c 'import json,sys; ids=json.loads(sys.argv[1]); print("matrix="+json.dumps({"include":[{"shard":s,"count":len(ids),"artifact":"window-gallery-"+s} for s in ids]}))' "$shards" > "$RUNNER_TEMP/gallery-plan-output"
          else
            echo 'matrix={"include":[{"shard":1,"artifact":"window-gallery","legacy":true}]}' > "$RUNNER_TEMP/gallery-plan-output"
          fi
          grep '^matrix=' "$RUNNER_TEMP/gallery-plan-output" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/gallery-plan"
          sed -n 's/^matrix=//p' "$RUNNER_TEMP/gallery-plan-output" > "$RUNNER_TEMP/gallery-plan/matrix.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery-plan
          path: ${{ runner.temp }}/gallery-plan/matrix.json
          overwrite: true
          retention-days: 7
          if-no-files-found: error
  gallery:
    name: gallery (${{ matrix.shard }})
    needs: [plan]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GALLERY_SHARD: ${{ matrix.shard }}
      GALLERY_SHARD_COUNT: ${{ matrix.count || 1 }}
      GALLERY_RUN: ${{ github.event.client_payload.id }}-${{ github.run_attempt }}
      GALLERY_LEGACY: ${{ matrix.legacy || false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the payload
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - run: pnpm install --frozen-lockfile
      # playwright's exact package version pins Chromium's revision. Never install it on the relay box.
      - run: pnpm --filter @agent-harness/gui exec playwright install --with-deps chromium
      - run: pnpm --filter @agent-harness/gui build-gallery
      - name: Capture and check the gallery
        id: capture
        # Finish artifact delivery even when geometry or the pixel gate fails.
        continue-on-error: true
        run: pnpm --filter @agent-harness/gui capture-gallery
      - name: Check each bounded desktop and phone report shard
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, sys
          sys.path.insert(0, "scripts")
          with open('packages/gui/gallery-images/report.json') as source:
              report = json.load(source)
          assert report['pixelBlocking'] is True, 'Every capture remains gated'
          if 'shard' in report:
              assert 'shards' not in report and isinstance(report.get('scenes'), list) and 0 < len(report['scenes']) <= 400, 'Capture budget exceeded'
              assert len({scene['name'] for scene in report['scenes']}) == len(report['scenes']), 'Duplicate gallery capture name'
              shard = report['shard']
              if 'id' in shard:
                  assert set(shard) == {'id', 'index', 'count'}
                  assert re.fullmatch(r'(desktop|phone)-[0-9]{3}', str(shard['id']))
                  assert shard['id'] == os.environ['GALLERY_SHARD']
                  assert type(shard['index']) is int and type(shard['count']) is int and 0 <= shard['index'] < shard['count'] <= 100
                  assert shard['count'] == int(os.environ['GALLERY_SHARD_COUNT'])
                  assert all(scene['name'].startswith('phone-') == shard['id'].startswith('phone-') for scene in report['scenes']), 'Wrong gallery shard family'
              else:
                  from gallery_reports import validate_shard
                  shard = validate_shard(shard, len(report['scenes']))
                  assert shard['index'] == int(os.environ['GALLERY_SHARD'])
                  assert shard['run'] == os.environ['GALLERY_RUN']
          else:
              assert os.environ.get('GALLERY_LEGACY') == 'true', 'Missing gallery shard metadata'
              assert os.environ['GALLERY_SHARD'] == '1', 'Legacy reports must be unsharded'
              if pathlib.Path('scripts/gallery_allocation.py').is_file() and pathlib.Path('scripts/gallery-allocation.json').is_file():
                  from gallery_allocation import report_scenes
                  scenes = report_scenes(report)
              else:
                  scenes = report.get('scenes')
                  assert 'shards' not in report and isinstance(scenes, list) and 0 < len(scenes) <= 400, 'Capture budget exceeded'
              assert len({scene['name'] for scene in scenes}) == len(scenes), 'Duplicate gallery capture name'
          PY
      - name: Optimise the PNGs losslessly
        run: |
          sudo apt-get update && sudo apt-get install -y optipng
          optipng -o2 packages/gui/gallery-images/*.png
          # Leave room for ZIP headers under the relay's 64 MiB transport cap.
          test "$(du -cb packages/gui/gallery-images/* | tail -1 | cut -f1)" -le 50331648
          if [ -f scripts/gallery_allocation.py ] && [ -f scripts/gallery-allocation.json ] && [ "${GALLERY_LEGACY:-false}" = true ]; then
            MAX_GALLERY_PNGS=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from gallery_allocation import MAX_PNGS; print(MAX_PNGS)')
          else
            MAX_GALLERY_PNGS=1200
          fi
          test "$(find packages/gui/gallery-images -name '*.png' | wc -l)" -le "$MAX_GALLERY_PNGS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            packages/gui/gallery-images/*.png
            packages/gui/gallery-images/*.json
          overwrite: true
          compression-level: 9
          retention-days: 7
          if-no-files-found: error
      - name: Enforce geometry and the pixel gate
        if: steps.capture.outcome == 'failure'
        run: exit 1
  cleanup:
    needs: [plan, gallery]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete this run's ref
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_REF: ci/${{ github.event.client_payload.id }}
        run: |
          [[ "$RUN_REF" =~ ^ci/[A-Za-z0-9._-]+$ ]] || { echo "::error::bad id"; exit 1; }
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$RUN_REF" || true
