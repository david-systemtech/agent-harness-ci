# CI for this repository. The checks run on GitHub's free public-repository
# runners, in david-systemtech/agent-harness-ci, and this job is the relay: it
# pushes the commit under test there, waits for the run and passes or fails
# with it (.forgejo/scripts/github-ci.sh). The `ci / ci` status the bots and
# the pull request page read is still this job's.
#
# The suite includes test/web-smoke.test.ts: the real served client over HTTPS,
# Chromium and WebKit, only on a hosted runner under its ordinary uid.
# The secret scan, install, typecheck, lint, suite and schema export drift
# check are in .forgejo/github-workflows/ci.yml; install that source byte for
# byte as .github/workflows/ci.yml on the relay repository's workflows branch.
#
# `relay` jobs only wait, so they use the self-hosted runner's `relay` label.
# Configure a repository secret named GH_CI_TOKEN: a fine-grained GitHub
# token scoped to agent-harness-ci alone.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Drafts are built too. Forgejo marks a draft with a "WIP:" title and has
    # no `ready_for_review`, so skipping drafts would mean listening for
    # `edited` to see one leave draft - and then every edit of a description
    # would start a run whose job is skipped, which cancels the run in flight
    # and posts "skipped" over the check's last verdict. The pool is ours and
    # this job is cheap; building a draft costs nothing that matters.
    types: [opened, synchronize, reopened]

# A push to a pull request that supersedes an earlier one cancels the old run.
# Main's runs are each their own group, so every merge gets a verdict and a red
# main names the merge that broke it. A shared main group could cancel earlier
# merges before their checks complete, or queue all main runs serially.
# GROUP below gives GitHub's run the same group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: relay
    # GitHub's test shards have 40 minutes, for the web smoke's wait on a slow Ubuntu
    # mirror (#1802); this leaves room for their queue and the push.
    timeout-minutes: 55
    steps:
      # The whole history, so the push to GitHub can send just what it lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run the checks on GitHub
        run: bash .forgejo/scripts/github-ci.sh
        env:
          GH_CI_TOKEN: ${{ secrets.GH_CI_TOKEN }}
          FORGEJO_TOKEN: ${{ github.token }}
          GROUP: ${{ github.event.pull_request.number || github.sha }}
          FORGEJO_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
