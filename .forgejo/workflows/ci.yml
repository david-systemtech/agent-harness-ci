# CI for a repository on this Forgejo. Copied from david/ci templates/ci.yml;
# add the project's own steps at the end of the job (typecheck, lint, test,
# build - cortex reference/playbooks/ci-standard.md lists them) and leave the
# rest as it is, so a fix in the template can be copied over again.
#
# It runs on the shared `ci` runners in the Dokploy VM, which every repository
# on the instance shares. The secret scan is david/ci's scripts/secret-scan.sh,
# checked out at run time, so a new gitleaks pin reaches every repository at
# once. Reading david/ci takes CI_READ_TOKEN, a user-level secret on `david`
# (a read-only user that can see david/ci and nothing else).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Drafts are built too. Forgejo marks a draft with a "WIP:" title and has
    # no `ready_for_review`, so skipping drafts would mean listening for
    # `edited` to see one leave draft - and then every edit of a description
    # would start a run whose job is skipped, which cancels the run in flight
    # and posts "skipped" over the check's last verdict. The pool is ours and
    # this job is cheap; building a draft costs nothing that matters.
    types: [opened, synchronize, reopened]

# A push to a pull request that supersedes an earlier one cancels the old run.
# So does a push to main, in this repository only (David, 2026-09-29): with
# several build bots landing, main's queue held a run for every merge (40 in
# 16 hours, about a fifth of CI), each re-testing a tree the next merge was
# about to replace. The newest main is always tested; a merge whose run was
# cancelled shares the verdict of the next one, and a red main is bisected
# across the merges since the last green. The david/ci template still queues
# main pushes, so copy a template fix over this block by hand.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ci
    timeout-minutes: 25
    steps:
      # Pinned to a commit, not a tag. Forgejo resolves `actions/checkout` to
      # its mirror on data.forgejo.org, which carries GitHub's commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads every commit.
          fetch-depth: 0

      - name: Check out david/ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: david/ci
          token: ${{ secrets.CI_READ_TOKEN }}
          path: .ci
          persist-credentials: false

      - name: Scan every commit for secrets
        run: bash .ci/scripts/secret-scan.sh

      # The project's own steps go here.
      - run: corepack enable && corepack prepare --activate
      # The pnpm store survives between runs in the ci runner's cache, keyed by
      # the lockfile, so an install links packages instead of downloading
      # them. pnpm checks every package against the lockfile's integrity hash
      # as it installs (verify-store-integrity is on by default), so a stale or
      # damaged cache costs time, never a wrong package.
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # scripts/install.ps1's tests run under PowerShell 7, which the image
      # lacks: pwsh.sh unpacks its pinned tarball, checked by SHA-256, and puts
      # it on the PATH. The tarball is cached by the script that pins it.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/agent-harness-pwsh
          key: pwsh-${{ runner.arch }}-${{ hashFiles('.forgejo/scripts/pwsh.sh') }}
      - name: PowerShell 7 for the install.ps1 tests
        run: bash .forgejo/scripts/pwsh.sh
      # Vitest sizes its pool to the 16 CPUs the job can see, but the three
      # ci jobs share one 8-CPU, 8 GB daemon: 16 workers peaked at 2.8 GB, 4
      # at 1.2 GB.
      - run: pnpm test --maxWorkers=4

      - name: The JSON Schema export is current
        # packages/contracts/schema is the JSON Schema export a client in
        # another language is written from (ADR 0001), published with every
        # release by being committed. Regenerate it; if that changes anything,
        # a schema changed and nobody exported it.
        run: |
          set -euo pipefail
          pnpm --filter @agent-harness/contracts export-schemas
          if [ -n "$(git status --porcelain -- packages/contracts/schema)" ]; then
            git status --short -- packages/contracts/schema
            echo "::error::packages/contracts/schema is stale - run: pnpm --filter @agent-harness/contracts export-schemas, and commit the result"
            exit 1
          fi
