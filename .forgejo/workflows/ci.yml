# CI for this repository. The checks run on GitHub's free public-repository
# runners, in david-systemtech/agent-harness-ci, and this job is the relay: it
# pushes the commit under test there, waits for the run and passes or fails
# with it (.forgejo/scripts/github-ci.sh). The `ci / ci` status the bots and
# the pull request page read is still this job's.
#
# Why (David, 2026-10-01): on 2026-09-30 this repository was 97% of all `ci`
# minutes on the shared pool, and SYSTEM-MNL ran at load 20-45 with the agent
# sessions and the pool's VM competing for its 16 threads. The checks
# themselves - the secret scan, install, typecheck, lint, the suite and the
# schema export drift check - are in agent-harness-ci's
# .github/workflows/ci.yml; change them there. They were this job's steps
# until then, copied from david/ci templates/ci.yml.
#
# `relay` jobs only wait, so they run on vm-relay-1 in the Dokploy VM, a
# runner and Docker daemon of their own (david/ci docs/runners.md), not on the
# `ci` runners. GH_CI_TOKEN is a fine-grained GitHub token for
# agent-harness-ci alone (OpenBao systemtechdev/github-agent-harness-ci).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Drafts are built too. Forgejo marks a draft with a "WIP:" title and has
    # no `ready_for_review`, so skipping drafts would mean listening for
    # `edited` to see one leave draft - and then every edit of a description
    # would start a run whose job is skipped, which cancels the run in flight
    # and posts "skipped" over the check's last verdict. The pool is ours and
    # this job is cheap; building a draft costs nothing that matters.
    types: [opened, synchronize, reopened]

# A push to a pull request that supersedes an earlier one cancels the old run.
# Main's runs are each their own group, so every merge gets a verdict and a red
# main names the merge that broke it. From 2026-09-29 a push to main cancelled
# main's run in flight too, to spare SYSTEM-MNL a run for every merge; once the
# checks moved to GitHub (2026-10-01) a run cost the homelab almost nothing,
# and with merges every two to three minutes against a run of about four and a
# half, main went untested for a whole afternoon (David, 2026-10-01). A shared
# group without cancelling would queue main's runs one at a time behind each
# other instead. GROUP below gives GitHub's run the same group. The relay
# waits out each run in a slot on vm-relay-1, whose 8 slots no other
# repository's jobs use. The david/ci template still queues main pushes in one
# group, so copy a template fix over this block by hand.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: relay
    # GitHub's job has 25 minutes; this leaves room for its queue and the push.
    timeout-minutes: 40
    steps:
      # The whole history, so the push to GitHub can send just what it lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run the checks on GitHub
        run: bash .forgejo/scripts/github-ci.sh
        env:
          GH_CI_TOKEN: ${{ secrets.GH_CI_TOKEN }}
          GROUP: ${{ github.event.pull_request.number || github.sha }}
          FORGEJO_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
