# Manual recovery only: select a v tag when dispatching. Tag pushes publish
# through the public GitHub snapshot's release workflow (#1258, #1275).
name: release

on:
  workflow_dispatch:

# A tag's run is never cancelled half-way through its push: a second run of
# the same tag queues behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The tag this run releases: v0.5.0.
  TAG: ${{ github.ref_name }}

jobs:
  check:
    runs-on: ci
    timeout-minutes: 25
    steps:
      # Pinned to a commit, not a tag, as ci.yml's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile

      - name: The tag's release is not published yet
        env:
          # The job's own token, which can write this repository's releases
          # (so it reads a draft too) on a push: Forgejo 16 gives a job write
          # access to every unit of its own repository unless it runs for a
          # fork's pull request (models/perm/access/repo_permission.go,
          # GetActionRepoPermission). Packages are not a unit of the
          # repository, hence the image job's PACKAGES_TOKEN.
          RELEASE_TOKEN: ${{ github.token }}
        run: pnpm --filter agent-harness publish-release --tag "$TAG" --check

      - run: pnpm typecheck
      - run: pnpm lint
      # PowerShell 7 for the install.ps1 tests, as ci.yml puts it on the PATH.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/agent-harness-pwsh
          key: pwsh-${{ runner.arch }}-${{ hashFiles('.forgejo/scripts/pwsh.sh') }}
      - name: PowerShell 7 for the install.ps1 tests
        run: bash .forgejo/scripts/pwsh.sh
      # ci.yml's worker count, for the same shared daemon.
      - run: pnpm test --maxWorkers=4
      - name: The JSON Schema export is current
        # The release publishes packages/contracts/schema as it is committed.
        run: |
          set -euo pipefail
          pnpm --filter @agent-harness/contracts export-schemas
          if [ -n "$(git status --porcelain -- packages/contracts/schema)" ]; then
            git status --short -- packages/contracts/schema
            echo "::error::packages/contracts/schema is stale - run: pnpm --filter @agent-harness/contracts export-schemas, and commit the result"
            exit 1
          fi

  image:
    needs: check
    runs-on: build
    timeout-minutes: 30
    # The pushed image's reference and digest, for release.json: a host pulls
    # the image by both.
    outputs:
      reference: ${{ steps.publish.outputs.reference }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      # Pinned to a commit, not a tag, as ci.yml's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and push the version's image
        id: publish
        env:
          # A repository secret with package-write permission; the job token
          # cannot write packages.
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: bash .forgejo/scripts/image.sh publish

  desktop-macos:
    needs: [check, image]
    runs-on: macos
    timeout-minutes: 60
    env:
      # The release build of the server artefact names the release's image, as the release job's does.
      IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's own Node 24 provides corepack and the pinned pnpm.
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile

      # The Mac keeps its workspace between runs, so the folders a run writes are cleared first.
      - name: The darwin-arm64 server artefact
        run: |
          set -euo pipefail
          rm -rf server desktop unzipped tarball
          pnpm --filter agent-harness build-artefacts --tag "$TAG" --out server --platform darwin-arm64 \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$IMAGE_DIGEST"

      - name: The macOS zip
        run: pnpm --filter @agent-harness/desktop build-desktop --platform darwin-arm64 --tag "$TAG" --server server/agent-harness-darwin-arm64.tar.gz --out desktop

      # No file in it is quarantined, so the bundle the desktop's update unpacks from it meets no Gatekeeper check.
      - name: The zip holds one bundle, signed ad hoc and not quarantined, which claims the scheme and carries its server artefact
        run: |
          set -euo pipefail
          zip=desktop/agent-harness-desktop-darwin-arm64.zip
          test "$(zipinfo -1 "$zip" | cut -d/ -f1 | sort -u)" = agent-harness.app
          ditto -x -k "$zip" unzipped
          app=unzipped/agent-harness.app
          codesign --verify --deep --strict "$app"
          test -z "$(xattr -r "$app" | grep com.apple.quarantine || true)"
          test -x "$app/Contents/MacOS/agent-harness"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = agent-harness
          test -x "$app/Contents/Resources/server/node/bin/node"
          test -f "$app/Contents/Resources/server/node_modules/@agent-harness/contracts/package.json"
          grep -q "\"version\": *\"${TAG#v}\"" "$app/Contents/Resources/server/packages/cli/package.json"

      # An environment's stored key names the Node that wrote it, so the desktop's Node is the tarball's, signed alike (#1724).
      - name: The bundled server's Node is signed as the server artefact's
        run: |
          set -euo pipefail
          mkdir tarball
          tar -xzf server/agent-harness-darwin-arm64.tar.gz -C tarball
          bundled=$(codesign -d -r- unzipped/agent-harness.app/Contents/Resources/server/node/bin/node 2>&1 | grep '^designated => ')
          artefact=$(codesign -d -r- tarball/node/bin/node 2>&1 | grep '^designated => ')
          printf 'desktop:  %s\nartefact: %s\n' "$bundled" "$artefact"
          test "$bundled" = "$artefact"

      - name: Hand the desktop to the release job
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: bash .forgejo/scripts/desktop-builds.sh put desktop/agent-harness-desktop-darwin-arm64.zip

  desktop-windows:
    needs: [check, image]
    runs-on: ci-x64
    # electron-builder's own Wine image, pinned by its digest: Ubuntu 22.04 with winehq-stable and a Wine prefix made,
    # Node 24, build-essential, Python 3 and bsdtar. The email app's Windows release builds in it too.
    container:
      image: electronuserland/builder:24-wine-05.26@sha256:41ae540902461b6cbc988987db79547fcc10cda04d2a6c6367504f59d4b37c64
    timeout-minutes: 60
    env:
      # The release build of the server artefact names the release's image, as the release job's does.
      IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # A store of its own: pnpm's side-effects cache would hand it node-pty as built against bookworm's C library.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-wine-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-wine-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile

      # The release build checks the artefact of the platform it runs on, so it builds linux-x64's beside it.
      - name: The win32-x64 server artefact
        run: |
          set -euo pipefail
          pnpm --filter agent-harness build-artefacts --tag "$TAG" --out server --platform linux-x64 --platform win32-x64 \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$IMAGE_DIGEST"

      - name: The Windows setup
        run: pnpm --filter @agent-harness/desktop build-desktop --platform win32-x64 --tag "$TAG" --server server/agent-harness-win32-x64.zip --out desktop

      # What Linux can read of it: electron-builder fails the step above when Wine did not write the uninstaller.
      - name: The setup is a Windows executable
        run: test "$(head -c 2 desktop/agent-harness-desktop-win32-x64-setup.exe)" = MZ

      - name: The setup carries its server dependencies
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y --no-install-recommends curl xz-utils
          sevenzip=$(bash scripts/7zip.sh)
          rm -rf unpacked-setup unpacked-windows
          "$sevenzip" x -y desktop/agent-harness-desktop-win32-x64-setup.exe -ounpacked-setup
          payload=$(find unpacked-setup -type f -name 'app-64.7z')
          test -f "$payload"
          "$sevenzip" x -y "$payload" -ounpacked-windows
          test -f unpacked-windows/resources/server/node_modules/@agent-harness/contracts/package.json

      - name: Hand the desktop to the release job
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: bash .forgejo/scripts/desktop-builds.sh put desktop/agent-harness-desktop-win32-x64-setup.exe

  desktop-arch:
    needs: [check, image]
    runs-on: ci-x64
    timeout-minutes: 60
    env:
      # The release build of the server artefact names the release's image, as the release job's does.
      IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      # Pinned to a commit, not a tag, as ci.yml's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile

      # electron-builder's fpm writes the package's .MTREE with bsdtar, which node:24-bookworm lacks.
      - name: The tools the Arch package is packed with
        run: apt-get update && apt-get install -y --no-install-recommends libarchive-tools

      - name: The linux-x64 server artefact
        run: |
          set -euo pipefail
          pnpm --filter agent-harness build-artefacts --tag "$TAG" --out server --platform linux-x64 \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$IMAGE_DIGEST"

      - name: The Arch package
        run: pnpm --filter @agent-harness/desktop build-desktop --platform linux-x64 --tag "$TAG" --server server/agent-harness-linux-x64.tar.gz --out desktop

      - name: The package is agent-harness-desktop, claims the scheme and carries its server artefact
        run: |
          set -euo pipefail
          mkdir unpacked
          bsdtar -xf desktop/agent-harness-desktop-linux-x64.pacman -C unpacked
          grep -qx "pkgname = agent-harness-desktop" unpacked/.PKGINFO
          grep -qx "depend = polkit" unpacked/.PKGINFO
          grep -q "^Exec=/opt/agent-harness/agent-harness-desktop %U$" unpacked/usr/share/applications/agent-harness-desktop.desktop
          grep -q "^MimeType=.*x-scheme-handler/agent-harness;" unpacked/usr/share/applications/agent-harness-desktop.desktop
          test -x unpacked/opt/agent-harness/agent-harness-desktop
          test -x unpacked/opt/agent-harness/resources/server/node/bin/node
          test -f unpacked/opt/agent-harness/resources/server/node_modules/@agent-harness/contracts/package.json
          grep -q "\"version\": *\"${TAG#v}\"" unpacked/opt/agent-harness/resources/server/packages/cli/package.json

      - name: Hand the desktop to the release job
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: bash .forgejo/scripts/desktop-builds.sh put desktop/agent-harness-desktop-linux-x64.pacman

  release:
    needs: [check, image, desktop-macos, desktop-windows, desktop-arch]
    # An x86_64 runner with node:24-bookworm builds and runs the linux-x64
    # artefact (#356). The `ci-x64` label guarantees this architecture.
    # One job builds and publishes so artefacts need not travel between jobs.
    runs-on: ci-x64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile

      - name: The desktop jobs' builds
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          bash .forgejo/scripts/desktop-builds.sh get desktop agent-harness-desktop-darwin-arm64.zip \
            agent-harness-desktop-win32-x64-setup.exe agent-harness-desktop-linux-x64.pacman

      # The asset list: every asset of the release beside the server
      # artefacts and release.json, one `--asset <kind>=<path>` line each,
      # which the build writes into release-assets with its sidecar and lists
      # in release.json (kinds: the contracts' RELEASE_ASSET_KINDS). A file is
      # published under its own name, the compose file with this release's
      # image in place of its unreleased placeholder; a folder as
      # agent-harness-<kind>.tar.gz. A desktop is listed with the platform
      # and format its shell's update installs (`desktop:<platform>:<format>=`),
      # which the environment stages it by. Adding an asset is one more line
      # here.
      - name: Build the server artefacts and the release's assets
        env:
          IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          pnpm --filter agent-harness build-artefacts --tag "$TAG" --out release-assets \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$IMAGE_DIGEST" \
            --asset schema=packages/contracts/schema \
            --asset install-script=scripts/install.sh \
            --asset install-script=scripts/install.ps1 \
            --asset compose=scripts/compose.yaml \
            --asset host-updater=scripts/host-updater.sh \
            --asset desktop:darwin-arm64:zip=desktop/agent-harness-desktop-darwin-arm64.zip \
            --asset desktop:win32-x64:nsis=desktop/agent-harness-desktop-win32-x64-setup.exe \
            --asset desktop:linux-x64:pacman=desktop/agent-harness-desktop-linux-x64.pacman

      - name: Upload every asset to a draft release, then publish it
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: pnpm --filter agent-harness publish-release --tag "$TAG" --from release-assets

      # Only once the release is out: until then a re-run of this job alone finds them again.
      - name: Remove the desktop jobs' builds from the package registry
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: bash .forgejo/scripts/desktop-builds.sh remove
