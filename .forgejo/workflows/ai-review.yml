# Codex reads the pull request before we do.
#
# Copied from david/ci templates/ai-review.yml. Change only REVIEW_PROJECT,
# REVIEW_SKIP and, if the rules are not in AGENTS.md, REVIEW_RULES; the rest is
# the same in every repository, so a fix in the template can be copied over.
#
# It leaves one comment, ending in a JSON block: the prose is for whoever
# reviews the pull request, the JSON for an agent that re-checks the findings
# before anyone acts on them. A finding is a lead, never a verdict. It
# approves nothing, is not a required check, and never fails: a rate-limited
# provider or a model that runs out of time ends in a comment that says there
# is no review, and a green check.
#
# The work is david/ci's scripts/codex_review.py, checked out at run time
# from david/ci's main: one `codex exec` run on the diff, under David's Codex
# plan, answering in the same comment shape as the OpenRouter review it
# replaced on 2026-10-09 (david/ci issue 41: the credits ran out). This
# repository's BASE commit is checked out for the rules the model is told and
# for the code around the diff, which Codex may read but not write (sandbox
# read-only); the pull request's changes arrive as text through the API, so
# nothing in a pull request runs here or rewrites the rules it is judged by.
#
# When it runs: when a pull request opens, reopens or leaves draft (on Forgejo,
# a title edit that drops the "WIP:" prefix), and after that only when someone
# adds the `ai-review` label. The label comes off again after every run that
# found it on, so it can be added a second time. It asks for a review of the
# head as it is now: a head the comment already names is left alone, so push
# first and add the label after. `no-ai-review` suppresses it. Create both
# labels on the repository.
#
# Where it runs: the `codex` runner, a host runner on the SYSTEM-SERVER agent
# container - the only machine with the Codex login, which the runner's config
# hands the job as CODEX_HOME - never `ci` or `review`. A review can take
# twenty minutes, and `ci` must not queue behind it.

name: AI review

on:
  pull_request:
    types: [opened, reopened, edited, labeled]

# Two requests for a review must not leave two reviews racing to rewrite one
# comment. Every run the job's `if` will skip - one on a draft, one woken by
# some other label - gets a group of its own, because concurrency applies
# before that `if` and such a run would otherwise cancel a review on the way.
#
# Every edit reaches the job too. Forgejo's `edited` event says nothing
# about what changed (no `changes` in its payload, measured 2026-09-23), so
# the `if` cannot tell an edit that takes the pull request out of draft from
# a description edit; the script asks the timeline and leaves all but the
# first kind alone. An edit shares the review's group but queues in it rather
# than cancelling: a description edit waits behind a review that is running
# instead of ending it, a title edit that arrives twice is answered once, and
# a label pressed during a leaving-draft review replaces it, as a label always
# has. Forgejo evaluates `cancel-in-progress` as an expression (runner
# v12.13.2, jobparser.EvaluateWorkflowConcurrency).
#
# Such a run still posts its job as the check's latest status, so after a
# description edit the review's check reads as a short green run. The comment
# is what counts, and it is left alone.
#
# A label's run is told by `github.event.label`, which only a label event
# carries, and never by the action's name: Forgejo calls adding a label
# `label_updated`, not `labeled` (every label run's payload since 2026-09-23,
# checked 2026-09-28). Testing the action for `labeled` let every label
# through, here and in both `if`s below - the builder bots' `bot-1` and `bot-2`
# ran 34 full reviews on 2026-09-25 and 26, and in the review's own group they
# cancelled the reviews already on the way.
concurrency:
  group: >-
    ai-review-${{ github.event.pull_request.number }}-${{
    github.event.pull_request.draft && 'draft' ||
    (github.event.label && github.event.label.name != 'ai-review') && 'other-label' ||
    'review' }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

jobs:
  review:
    # `WIP:` and `[WIP]` are the instance's draft prefixes: Forgejo 16's
    # default WORK_IN_PROGRESS_PREFIXES, not overridden in app.ini (checked
    # 2026-09-23). The script's WIP_PREFIXES names them; if that setting
    # changes, change it with it. An edit is let through here and judged by
    # the script (see concurrency, above). Renovate's pull requests are
    # version bumps with nothing for a reviewer to say, as Dependabot's were
    # on GitHub. Adding `ai-review` to one is a person's run and gets a review.
    if: >-
      !github.event.pull_request.draft &&
      github.actor != 'renovate' &&
      !contains(github.event.pull_request.labels.*.name, 'no-ai-review') &&
      (!github.event.label || github.event.label.name == 'ai-review')
    runs-on: codex
    # A backstop only. The script abandons a review at REVIEW_DEADLINE_S and
    # exits green, and the step has its own timeout under continue-on-error.
    timeout-minutes: 55
    steps:
      # The base commit, never the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check out david/ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: david/ci
          token: ${{ secrets.CI_READ_TOKEN }}
          path: .ci
          persist-credentials: false

      - name: Review the diff
        continue-on-error: true
        # Longer than the script's own deadline, shorter than the job's.
        timeout-minutes: 50
        env:
          # The job's own token: it may comment on this repository's pull
          # requests, and its comments are by `forgejo-actions`.
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The Codex model and its reasoning effort (low, medium, high, xhigh).
          REVIEW_MODEL: gpt-6.1-sol
          REVIEW_EFFORT: high
          # How long one Codex run may take before the comment says there is
          # no review.
          REVIEW_DEADLINE_S: 2400
          # What the model is told the project is.
          REVIEW_PROJECT: >-
            A server-first coding-agent harness under a working name: an
            environment per machine, with every client (desktop, web, TUI) a
            remote client of it, one renderer, with skills, memory banks, key
            managers and a setup wizard as first-class features. The
            repository holds the application itself, a TypeScript pnpm
            workspace whose typecheck, lint and Vitest suite CI runs on every
            push, with its specs and decision records under docs/. Its
            packages/ are contracts (the zod schemas the other packages
            share), environment (the server every client connects to),
            client-runtime (the UI-free package every client renders from),
            theme (the colour tokens derived from a theme's seeds), browser
            (what runs in a browser page), extension (the Chrome extension),
            gui (the React renderer of the desktop window and the web tab),
            desktop (the Electron shell that carries gui), tui (the terminal
            UI) and cli (the agent-harness binary).
            The JSON Schema export in packages/contracts/schema/ is
            generated by `pnpm --filter @agent-harness/contracts
            export-schemas` and left out of the diff on purpose. CI fails any
            push whose committed export differs from the contracts types, so
            a pull request that changes a contracts type and shows no export
            is not missing one: never report the export as missing, stale or
            not regenerated.
          # Rules files, read from the base commit. Default AGENTS.md.
          # REVIEW_RULES: AGENTS.md
          # Noise on top of the lockfiles, images and fonts the script always
          # leaves out. Put every generated file here: the script sizes its
          # reasoning to the diff, and a large generated file can take a
          # review to its token ceiling with nothing to show.
          REVIEW_SKIP: docs/research/* packages/contracts/schema/*
        run: python3 .ci/scripts/codex_review.py

  # The label is a button, not a state: `labeled` fires only when a label goes
  # on, so one left on cannot be pressed again. It comes off after every run
  # that found it on, whether or not the review ran - a request declined for a
  # draft or for `no-ai-review` must not leave a label that looks armed.
  take-the-request-label-off:
    needs: review
    if: >-
      always() &&
      contains(github.event.pull_request.labels.*.name, 'ai-review') &&
      (!github.event.label || github.event.label.name == 'ai-review')
    runs-on: codex
    timeout-minutes: 5
    steps:
      # Green even when it fails, with a warning that says what to do.
      - name: Take the label off
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/ai-review"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: token $TOKEN" "$url" || true)
            # Forgejo takes the label's name here as well as its id
            # (routers/api/v1/repo/issue_label.go; measured 2026-09-23 on
            # david/ci#1 and david/agent-harness#54, where it came off), and
            # answers 422 when the label is already off.
            case "$code" in 2??|404|422) exit 0 ;; esac
            sleep $((attempt * 10))
          done
          echo "::warning::The ai-review label could not be removed. Remove it by hand, then add it again to ask for a review."
