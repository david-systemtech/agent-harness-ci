name: catalogue

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/contracts/src/catalogue-data.ts
      - packages/contracts/src/catalogue.ts
      - packages/contracts/src/readiness-overlay.ts
      - packages/contracts/src/readiness.ts
      - packages/contracts/src/skill-rules.ts
      - packages/environment/src/skills/reader.ts
      - packages/environment/src/skills/sidecar.ts
      - packages/environment/scripts/check-catalogue.ts
      - .forgejo/workflows/catalogue.yml
      - .forgejo/github-workflows/catalogue.yml
      - .forgejo/scripts/github-ci.sh
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - packages/contracts/src/catalogue-data.ts
      - packages/contracts/src/catalogue.ts
      - packages/contracts/src/readiness-overlay.ts
      - packages/contracts/src/readiness.ts
      - packages/contracts/src/skill-rules.ts
      - packages/environment/src/skills/reader.ts
      - packages/environment/src/skills/sidecar.ts
      - packages/environment/scripts/check-catalogue.ts
      - .forgejo/workflows/catalogue.yml
      - .forgejo/github-workflows/catalogue.yml
      - .forgejo/scripts/github-ci.sh

concurrency:
  group: catalogue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalogue:
    runs-on: relay
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check upstream skills on GitHub
        run: bash .forgejo/scripts/github-ci.sh
        env:
          GH_CI_TOKEN: ${{ secrets.GH_CI_TOKEN }}
          GH_CI_EVENT: catalogue
          GROUP: ${{ github.event.pull_request.number || github.ref }}
          FORGEJO_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
