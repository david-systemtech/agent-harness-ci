# The desktop build (#423; docs/specs/gui.md, "The desktop shell"): each
# platform's desktop built by `build-desktop` on a runner of that platform's
# OS, from that platform's server artefact of the same version, which the
# job builds first with the release build (#356), then checked as the
# platform's install reads it. Nothing is kept or published: the release
# workflow builds the desktops a tag publishes (#359), and this proves the
# build by hand before a tag needs it.
#
#   arch   linux-x64, the Arch package, on `ci-x64`, an x86_64 ci runner in
#          node:24-bookworm (the release job's label; until #813 puts it on
#          vm-ci-1 and desk-ci-1 the job waits in the queue)
#   macos  darwin-arm64, the macOS zip, on `macos` (mba-macos-1, jobs run on
#          David's MacBook itself), which signs it ad hoc; a job waits in the
#          queue while the Mac sleeps
#
# No runner has Windows, so the Windows NSIS setup (win32-x64) is built by
# hand with the same command: the desktop checklist's "Building a desktop".
#
# By hand only (workflow_dispatch), never on a pull request or main: the Mac
# sleeps, and each job downloads Node and Electron and packs about 250 MB.

name: desktop

on:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # A version no release has, which the release build and the desktop build take as one: 0.0.0-ci.<run number>.
  TAG: v0.0.0-ci.${{ github.run_number }}

jobs:
  arch:
    runs-on: ci-x64
    timeout-minutes: 60
    steps:
      # Pinned to a commit, not a tag, as ci.yml's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile

      # electron-builder's fpm writes the package's .MTREE with bsdtar, which node:24-bookworm lacks.
      - name: The tools the Arch package is packed with
        run: apt-get update && apt-get install -y --no-install-recommends libarchive-tools

      # The release build writes a manifest naming the release's image, which a build of no release has none of.
      - name: The linux-x64 server artefact
        run: |
          set -euo pipefail
          pnpm --filter agent-harness build-artefacts --tag "$TAG" --out server --platform linux-x64 \
            --image-reference "ci.invalid/agent-harness:${TAG#v}" --image-digest "sha256:$(printf '%064d' 0)"

      - name: The Arch package
        run: pnpm --filter @agent-harness/desktop build-desktop --platform linux-x64 --tag "$TAG" --server server/agent-harness-linux-x64.tar.gz --out desktop

      - name: The package is agent-harness-desktop, claims the scheme and carries its server artefact
        run: |
          set -euo pipefail
          mkdir unpacked
          bsdtar -xf desktop/agent-harness-desktop-linux-x64.pacman -C unpacked
          grep -qx "pkgname = agent-harness-desktop" unpacked/.PKGINFO
          grep -q "^Exec=/opt/agent-harness/agent-harness-desktop %U$" unpacked/usr/share/applications/agent-harness-desktop.desktop
          grep -q "^MimeType=.*x-scheme-handler/agent-harness;" unpacked/usr/share/applications/agent-harness-desktop.desktop
          test -x unpacked/opt/agent-harness/agent-harness-desktop
          test -x unpacked/opt/agent-harness/resources/server/node/bin/node
          grep -q "\"version\": *\"${TAG#v}\"" unpacked/opt/agent-harness/resources/server/packages/cli/package.json

  macos:
    runs-on: macos
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's own Node 24 (david/ci's runners/macos), whose corepack gives the pinned pnpm.
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile

      # The Mac keeps its workspace between runs, so the folders a run writes are cleared first.
      - name: The darwin-arm64 server artefact
        run: |
          set -euo pipefail
          rm -rf server desktop unzipped
          pnpm --filter agent-harness build-artefacts --tag "$TAG" --out server --platform darwin-arm64 \
            --image-reference "ci.invalid/agent-harness:${TAG#v}" --image-digest "sha256:$(printf '%064d' 0)"

      - name: The macOS zip
        run: pnpm --filter @agent-harness/desktop build-desktop --platform darwin-arm64 --tag "$TAG" --server server/agent-harness-darwin-arm64.tar.gz --out desktop

      - name: The zip holds one bundle, signed ad hoc, which claims the scheme and carries its server artefact
        run: |
          set -euo pipefail
          zip=desktop/agent-harness-desktop-darwin-arm64.zip
          test "$(zipinfo -1 "$zip" | cut -d/ -f1 | sort -u)" = agent-harness.app
          ditto -x -k "$zip" unzipped
          app=unzipped/agent-harness.app
          codesign --verify --deep --strict "$app"
          test -x "$app/Contents/MacOS/agent-harness"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = agent-harness
          test -x "$app/Contents/Resources/server/node/bin/node"
          grep -q "\"version\": *\"${TAG#v}\"" "$app/Contents/Resources/server/packages/cli/package.json"
