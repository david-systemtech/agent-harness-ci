          for attempt in 1 2; do
            defect="first start"
            if [ "$attempt" -eq 2 ]; then defect="second start/keychain read (#1381)"; fi
            "$node" "$cli" serve --data-dir "$data_dir" --port "$port" > "$data_dir/start-$attempt.log" 2>&1 &
            pid=$!
            ready=false
            for tick in {1..120}; do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              if curl --fail --silent --max-time 2 "http://127.0.0.1:$port/.well-known/agent-harness/environment" > "$data_dir/discovery.json" &&
                "$node" -e 'const discovery = require(process.argv[1]); if (discovery.harnessVersion !== process.env.VERSION || discovery.readiness !== "ready") process.exit(1);' "$data_dir/discovery.json"; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              cat "$data_dir/start-$attempt.log"
              echo "::error::$defect failed to become ready with release version $VERSION"
              exit 1
            fi
            echo "$defect ready with release version $VERSION"
            "$node" scripts/check-packaged-extension.mjs "$server" "$data_dir" "$VERSION"
            if [ "$attempt" -eq 2 ]; then
              "$node" "$cli" update status --json --data-dir "$data_dir" > "$data_dir/update-status.json"
              "$node" -e 'const status = require(process.argv[1]); if (status.version !== process.env.VERSION || status.pending.state !== "current") throw new Error("A superseded channel image is still pending");' "$data_dir/update-status.json"
            fi
            stop_environment
            # Model a volume retained across an external upgrade, without relying on a live release channel.
            "$node" --input-type=module - "$data_dir/environment.db" "$attempt" <<'NODE'
          import { DatabaseSync } from 'node:sqlite';
          import { randomUUID } from 'node:crypto';
          const db = new DatabaseSync(process.argv[2]);
          if (process.argv[3] === '1') {
            const stream = db.prepare("SELECT stream_id, MAX(stream_version) AS version FROM events WHERE stream_kind = 'environment' GROUP BY stream_id").get();
            if (!stream) throw new Error("No persisted environment stream");
            const payload = { updateId: randomUUID(), toVersion: process.env.VERSION, source: "channel", since: new Date(0).toISOString(), deferUntil: new Date(86400000).toISOString(), image: { reference: 'registry.example.com/agent-harness:0.0.0', digest: 'sha256:' + '5'.repeat(64) } };
            db.prepare("INSERT INTO events (event_id, stream_kind, stream_id, stream_version, type, occurred_at, actor, payload) VALUES (?, 'environment', ?, ?, 'environment.update-pending', ?, 'system:updates', ?)").run(randomUUID(), stream.stream_id, stream.version + 1, new Date().toISOString(), JSON.stringify(payload));
          } else {
            const pending = db.prepare("SELECT payload FROM events WHERE type = 'environment.update-pending' ORDER BY sequence DESC LIMIT 1").get();
            const cancelled = db.prepare("SELECT payload FROM events WHERE type = 'environment.update-cancelled' ORDER BY sequence DESC LIMIT 1").get();
            const outcome = cancelled && JSON.parse(cancelled.payload);
            if (!pending || !outcome || outcome.updateId !== JSON.parse(pending.payload).updateId || !(outcome.cause === "superseded")) throw new Error("Channel withdrawal was not persisted");
          }
          db.close();
          NODE
          done

  release:
    needs: [prepare, verify, suite, image-push, desktop-macos, desktop-windows, desktop-arch, smoke-windows, smoke-macos, smoke-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile

      - name: The desktop jobs' builds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true

      - name: Build the server artefacts and the release's assets
        env:
          IMAGE_REFERENCE: ${{ needs.image-push.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.image-push.outputs.digest }}
        run: |
          pnpm --filter agent-harness build-artefacts --tag "$TAG" --out release-assets \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$IMAGE_DIGEST" \
            --asset schema=packages/contracts/schema \
            --asset install-script=scripts/install.sh \
            --asset install-script=scripts/install.ps1 \
            --asset compose=scripts/compose.yaml \
            --asset host-updater=scripts/host-updater.sh \
            --asset desktop:darwin-arm64:zip=desktop/agent-harness-desktop-darwin-arm64.zip \
            --asset desktop:win32-x64:nsis=desktop/agent-harness-desktop-win32-x64-setup.exe \
            --asset desktop:linux-x64:pacman=desktop/agent-harness-desktop-linux-x64.pacman

      - name: Keep all artefacts, including for a dry run
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload every asset to a draft release, then publish it
        if: needs.prepare.outputs.publish == 'true'
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: pnpm --filter agent-harness publish-release --tag "$TAG" --from release-assets

      - name: Authenticate to ghcr after publishing a stable release
        if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'false'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'false'
      - name: Point latest at the stable release's exact image
        if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'false'
        env:
          IMAGE_REFERENCE: ${{ needs.image-push.outputs.reference }}
          IMAGE_DIGEST: ${{ needs.image-push.outputs.digest }}
        run: docker buildx imagetools create --prefer-index=false --tag ghcr.io/david-systemtech/agent-harness:latest "$IMAGE_REFERENCE@$IMAGE_DIGEST"
