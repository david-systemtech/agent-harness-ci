# The snapshot publisher installs this overlay in the public repository's workflows.
# Its version tags start releases; branch pushes register no run.
# Manual dispatch builds all assets with a synthetic version, without publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# prepare decides the run in a minute; the builds and their smokes start from it and run beside
# verify (typecheck, lint, schema export) and suite, the whole test suite in six shards. Nothing
# is pushed or published until both have passed: image-push and release wait for them.
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.run.outputs.tag }}
      version: ${{ steps.run.outputs.version }}
      publish: ${{ steps.run.outputs.publish }}
      prerelease: ${{ steps.run.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile

      - name: Prepare the tag or dry run
        id: run
        run: pnpm exec tsx --conditions=@agent-harness/source packages/cli/scripts/prepare-release.ts
      - name: The tag's release is not published yet
        if: steps.run.outputs.publish == 'true'
        env:
          TAG: ${{ steps.run.outputs.tag }}
          RELEASE_TOKEN: ${{ github.token }}
        run: pnpm --filter agent-harness publish-release --tag "$TAG" --check

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - name: The JSON Schema export is current
        run: |
          set -euo pipefail
          pnpm --filter @agent-harness/contracts export-schemas
          if [ -n "$(git status --porcelain -- packages/contracts/schema)" ]; then
            git status --short -- packages/contracts/schema
            echo "::error::packages/contracts/schema is stale - run: pnpm --filter @agent-harness/contracts export-schemas, and commit the result"
            exit 1
          fi

  # One hosted runner no longer finishes the whole suite in 30 minutes (run 37441040959), so it
  # runs in six shards, as pull request CI does (#1687).
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile
      # Four workers for four vCPUs.
      - name: The suite shard
        run: pnpm test --maxWorkers=4 --shard=${{ matrix.shard }}/6

  image:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE_REFERENCE: ghcr.io/david-systemtech/agent-harness:${{ needs.prepare.outputs.version }}
    outputs:
      reference: ghcr.io/david-systemtech/agent-harness:${{ needs.prepare.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image locally
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ghcr.io/david-systemtech/agent-harness:${{ needs.prepare.outputs.version }}
          build-args: |
            HARNESS_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/david-systemtech/agent-harness
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Check the image's version
        run: |
          set -euo pipefail
          reported=$(docker run --rm "$IMAGE_REFERENCE" --version)
          if [ "$reported" != "agent-harness $VERSION" ]; then
            echo "::error::image reports $reported, expected agent-harness $VERSION"
            exit 1
          fi
      - name: Inspect a container update without applying it
        run: |
          set -euo pipefail
          project=$(mktemp -d)
          compose_file="$project/compose.yaml"
          cp scripts/compose.yaml "$compose_file"
          cp scripts/host-updater.sh "$project/host-updater.sh"
          printf 'AGENT_HARNESS_IMAGE=%s\n' "$IMAGE_REFERENCE" > "$project/.env"
          cleanup() {
            result=$?
            trap - EXIT
            docker compose -f "$compose_file" down --volumes --timeout 5 || result=1
            rm -rf "$project"
            exit "$result"
          }
          trap cleanup EXIT
          docker compose -f "$compose_file" up -d --pull never environment
          ready=false
          for tick in {1..120}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:7433/health | grep -q '"status"[[:space:]]*:[[:space:]]*"ready"'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker compose -f "$compose_file" logs environment
            echo "::error::container did not become ready for the updater inspection"
            exit 1
          fi
          before=$(find "$project" -type f -exec sha256sum {} + | sort)
          docker compose -f "$compose_file" exec -T environment agent-harness update status --json --data-dir /data | grep -q '"lastPoll": null'
          output=$(AGENT_HARNESS_COMPOSE_FILE="$compose_file" sh "$project/host-updater.sh" --dry-run)
          printf '%s\n' "$output"
          grep -q 'No pending update.' <<< "$output"
          grep -Fq "Current image: $IMAGE_REFERENCE" <<< "$output"
          after=$(find "$project" -type f -exec sha256sum {} + | sort)
          test "$before" = "$after"
          docker compose -f "$compose_file" exec -T environment agent-harness update status --json --data-dir /data | grep -q '"lastPoll": null'

      # A dry run hands the image on too, so the transfer is rehearsed before a tag needs it.
      - name: Keep the verified image for its push
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-image"
          docker save "$IMAGE_REFERENCE" | gzip -1 > "$RUNNER_TEMP/container-image/image.tar.gz"
      - name: Hand the verified image to its push
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: container-image
          path: ${{ runner.temp }}/container-image/image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The desktops build from the image job's digest before any push; only their desktop leaves
  # the job, and the release writes its manifest from this job's digest, the pushed image's.
  image-push:
    needs: [prepare, verify, suite, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
    outputs:
      reference: ${{ needs.image.outputs.reference }}
      digest: ${{ steps.publish.outputs.digest || needs.image.outputs.digest }}
    steps:
      - name: The verified image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: container-image
          path: ${{ runner.temp }}/container-image
      - name: Load the verified image
        run: docker load --input "$RUNNER_TEMP/container-image/image.tar.gz"
      - name: Authenticate to ghcr for a tag only
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the verified image on a tag
        id: publish
        if: needs.prepare.outputs.publish == 'true'
        run: |
          set -euo pipefail
          docker push "$IMAGE_REFERENCE"
          reference_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REFERENCE")
          echo "digest=${reference_digest#*@}" >> "$GITHUB_OUTPUT"

  desktop-macos:
    needs: [prepare, image]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile

      - name: The darwin-arm64 server artefact
        run: |
          set -euo pipefail
          rm -rf server desktop unzipped
          pnpm --filter agent-harness build-artefacts --tag "$TAG" --out server --platform darwin-arm64 \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$IMAGE_DIGEST"

      - name: The macOS zip
        run: pnpm --filter @agent-harness/desktop build-desktop --platform darwin-arm64 --tag "$TAG" --server server/agent-harness-darwin-arm64.tar.gz --out desktop

      - name: The zip holds one bundle, signed ad hoc and not quarantined, which claims the scheme and carries its server artefact
        run: |
          set -euo pipefail
          zip=desktop/agent-harness-desktop-darwin-arm64.zip
          test "$(zipinfo -1 "$zip" | cut -d/ -f1 | sort -u)" = agent-harness.app
          ditto -x -k "$zip" unzipped
          app=unzipped/agent-harness.app
          codesign --verify --deep --strict "$app"
          test -z "$(xattr -r "$app" | grep com.apple.quarantine || true)"
          test -x "$app/Contents/MacOS/agent-harness"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist")" = agent-harness
          test -x "$app/Contents/Resources/server/node/bin/node"
          test -f "$app/Contents/Resources/server/node_modules/@agent-harness/contracts/package.json"
          grep -q "\"version\": *\"${TAG#v}\"" "$app/Contents/Resources/server/packages/cli/package.json"

      - name: Keep the desktop build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-darwin-arm64
          path: desktop/agent-harness-desktop-darwin-arm64.zip
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:24-wine-05.26@sha256:41ae540902461b6cbc988987db79547fcc10cda04d2a6c6367504f59d4b37c64
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-wine-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-wine-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile

      - name: The win32-x64 server artefact
        run: |
          set -euo pipefail
          pnpm --filter agent-harness build-artefacts --tag "$TAG" --out server --platform linux-x64 --platform win32-x64 \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$IMAGE_DIGEST"

      # GitHub mounts its own HOME into container jobs, owned by the runner's user, and wine
      # refuses to make its prefix there; the image's root user has its own home with a prefix.
      - name: The Windows setup
        env:
          HOME: /root
        run: pnpm --filter @agent-harness/desktop build-desktop --platform win32-x64 --tag "$TAG" --server server/agent-harness-win32-x64.zip --out desktop

      - name: The setup is a Windows executable
        run: test "$(head -c 2 desktop/agent-harness-desktop-win32-x64-setup.exe)" = MZ

      - name: The setup carries its server dependencies
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y --no-install-recommends curl xz-utils
          sevenzip=$(bash scripts/7zip.sh)
          rm -rf unpacked-setup unpacked-windows
          "$sevenzip" x -y desktop/agent-harness-desktop-win32-x64-setup.exe -ounpacked-setup
          payload=$(find unpacked-setup -type f -name 'app-64.7z')
          test -f "$payload"
          "$sevenzip" x -y "$payload" -ounpacked-windows
          test -f unpacked-windows/resources/server/node_modules/@agent-harness/contracts/package.json

      - name: Keep the desktop build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-win32-x64
          path: desktop/agent-harness-desktop-win32-x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  desktop-arch:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      IMAGE_REFERENCE: ${{ needs.image.outputs.reference }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare --activate
      - name: Where pnpm keeps its store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ github.repository }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ github.repository }}-
      - run: pnpm install --frozen-lockfile

      - name: The tools the Arch package is packed with
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: The linux-x64 server artefact
        run: |
          set -euo pipefail
          pnpm --filter agent-harness build-artefacts --tag "$TAG" --out server --platform linux-x64 \
            --image-reference "$IMAGE_REFERENCE" --image-digest "$IMAGE_DIGEST"

      - name: The Arch package
        run: pnpm --filter @agent-harness/desktop build-desktop --platform linux-x64 --tag "$TAG" --server server/agent-harness-linux-x64.tar.gz --out desktop

      - name: The package is agent-harness-desktop, claims the scheme and carries its server artefact
        run: |
          set -euo pipefail
          mkdir unpacked
          bsdtar -xf desktop/agent-harness-desktop-linux-x64.pacman -C unpacked
          grep -qx "pkgname = agent-harness-desktop" unpacked/.PKGINFO
          grep -qx "depend = polkit" unpacked/.PKGINFO
          grep -q "^Exec=/opt/agent-harness/agent-harness-desktop %U$" unpacked/usr/share/applications/agent-harness-desktop.desktop
          grep -q "^MimeType=.*x-scheme-handler/agent-harness;" unpacked/usr/share/applications/agent-harness-desktop.desktop
          test -x unpacked/opt/agent-harness/agent-harness-desktop
          test -x unpacked/opt/agent-harness/resources/server/node/bin/node
          test -f unpacked/opt/agent-harness/resources/server/node_modules/@agent-harness/contracts/package.json
          grep -q "\"version\": *\"${TAG#v}\"" unpacked/opt/agent-harness/resources/server/packages/cli/package.json

      - name: Keep the desktop build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-linux-x64
          path: desktop/agent-harness-desktop-linux-x64.pacman
          if-no-files-found: error
          retention-days: 7

  smoke-windows:
    needs: [prepare, desktop-windows]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: desktop-win32-x64
          path: desktop
      - name: Run the installed server and every startup check as an ordinary Windows user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $user = 'ah-smoke-' + [Guid]::NewGuid().ToString('N').Substring(0, 8)
          $password = ConvertTo-SecureString ('aA7!' + [Guid]::NewGuid().ToString('N')) -AsPlainText -Force
          $credential = [PSCredential]::new("$env:COMPUTERNAME\$user", $password)
          $work = Join-Path $env:PUBLIC ('agent-harness-smoke-' + [Guid]::NewGuid())
          $created = $false
          $batchLogon = $false
          . (Resolve-Path 'scripts/windows-smoke-diagnostics.ps1').Path
          . (Resolve-Path 'scripts/windows-logon-right.ps1').Path
          $diagnostics = Join-Path (Get-Location).Path 'windows-smoke-diagnostics'
          $diagnosticSecrets = @($credential.GetNetworkCredential().Password)
          $smokeStartedAt = [datetime]::UtcNow
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          try {
            & wevtutil.exe sl Microsoft-Windows-TaskScheduler/Operational /e:true
            if ($LASTEXITCODE -ne 0) { throw 'Could not enable Task Scheduler smoke diagnostics' }
            $account = New-LocalUser -Name $user -Password $password -AccountNeverExpires -PasswordNeverExpires
            $created = $true
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $account
            # The scheduled-task check registers a Password logon, a batch logon that
            # Users lack on Windows Server; grant only that right, never a group (#1683).
            Grant-WindowsLogonRight -Sid $account.SID.Value -Right SeBatchLogonRight
            $batchLogon = $true
            New-Item -ItemType Directory -Path (Join-Path $work 'desktop') -Force | Out-Null
            Copy-Item -LiteralPath (Resolve-Path 'desktop/agent-harness-desktop-win32-x64-setup.exe').Path -Destination (Join-Path $work 'desktop')
            New-Item -ItemType Directory -Path (Join-Path $work 'scripts') -Force | Out-Null
            Copy-Item -LiteralPath (Resolve-Path 'scripts/check-packaged-extension.mjs').Path -Destination (Join-Path $work 'scripts')
            Copy-Item -LiteralPath (Resolve-Path 'scripts/check-packaged-update-disk.mjs').Path -Destination (Join-Path $work 'scripts')
            Copy-Item -LiteralPath (Resolve-Path 'scripts/check-packaged-provider-sign-in.mjs').Path -Destination (Join-Path $work 'scripts')
            Copy-Item -LiteralPath (Resolve-Path 'scripts/stop-windows-process-tree.ps1').Path -Destination (Join-Path $work 'scripts')
            Copy-Item -LiteralPath (Resolve-Path 'scripts/windows-smoke-diagnostics.ps1').Path -Destination (Join-Path $work 'scripts')
            Copy-Item -LiteralPath (Resolve-Path 'scripts/install.ps1').Path -Destination (Join-Path $work 'install.ps1')
            $smoke = @'
          param([Parameter(Mandatory)][string] $Version)
          $ErrorActionPreference = 'Stop'
          $env:VERSION = $Version
          . (Join-Path $PSScriptRoot 'scripts/windows-smoke-diagnostics.ps1')
          $diagnostics = Join-Path $PSScriptRoot 'diagnostics'
          $smokeStartedAt = [datetime]::UtcNow
          $diagnosticSecrets = @([IO.File]::ReadAllText((Join-Path $PSScriptRoot 'task-password.txt')))
          $lastDiscovery = $null
          $lastRequestError = ''
          $env:USERPROFILE = [Environment]::GetFolderPath('UserProfile')
          $env:LOCALAPPDATA = [Environment]::GetFolderPath('LocalApplicationData')
          $env:APPDATA = [Environment]::GetFolderPath('ApplicationData')
          if (!$env:USERPROFILE -or !$env:LOCALAPPDATA -or !$env:APPDATA) { throw 'The smoke user profile did not load' }
          $env:USERNAME = [Environment]::UserName
          $env:USERDOMAIN = [Environment]::UserDomainName
          $env:TEMP = Join-Path $env:LOCALAPPDATA 'Temp'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          $groups = (& "$env:SystemRoot\System32\whoami.exe" /groups | Out-String)
          if ($LASTEXITCODE -ne 0 -or $groups -notmatch 'S-1-16-(\d+)') { throw 'Could not read the smoke user token' }
          if ([int]$Matches[1] -ge 12288) { throw 'The smoke child still has an elevated Windows token' }
          Write-Output "Smoke user token mandatory level: $($Matches[1])"
          $PSNativeCommandUseErrorActionPreference = $false
          Remove-Item Env:\AGENT_HARNESS_TOKEN -ErrorAction SilentlyContinue
          $plan = & (Join-Path $PSScriptRoot 'install.ps1') -DryRun -DataDir (Join-Path $PSScriptRoot 'headless-install') 6>&1
          if ($LASTEXITCODE -ne 0) { throw 'The anonymous headless install could not resolve a public release' }
          $planText = $plan -join "`n"
          Write-Output $planText
          if ($planText -notmatch 'https://github.com/david-systemtech/agent-harness/releases/download/') { throw 'The installer did not select public assets' }
          if ($planText -match 'AGENT_HARNESS_TOKEN|Authorization|/api/v1/repos/') { throw 'The installer still requires private access' }
          $setup = Start-Process -FilePath (Resolve-Path "desktop/agent-harness-desktop-win32-x64-setup.exe").Path -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup exited with $($setup.ExitCode)" }
          $server = Join-Path $env:LOCALAPPDATA "Programs\agent-harness-desktop\resources\server"
          if (!(Test-Path (Join-Path $server "node_modules\@agent-harness\contracts\package.json"))) { throw 'The installed server lacks contracts' }
          $node = Join-Path $server "node\node.exe"
          $cli = Join-Path $server "packages\cli\dist\main.js"
          & $node scripts/check-packaged-update-disk.mjs $server
          if ($LASTEXITCODE -ne 0) { throw 'Packaged update disk check failed' }
          & $node scripts/check-packaged-provider-sign-in.mjs $server
          if ($LASTEXITCODE -ne 0) { throw 'Packaged provider sign-in check failed' }
          $version = & $node $cli --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "agent-harness $env:VERSION") { throw "Unexpected version: $version" }
          $status = (& $node $cli service status 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $status
          if ($code -ne 3 -or $status -notmatch 'No service is installed') { throw "Unexpected service status (exit $code)" }

          $server = Join-Path $env:LOCALAPPDATA "Programs\agent-harness-desktop\resources\server"
          $node = Join-Path $server "node\node.exe"
          $cli = Join-Path $server "packages\cli\dist\main.js"
          $dataDir = Join-Path $env:LOCALAPPDATA "agent-harness"
          New-Item -ItemType Directory -Path $dataDir | Out-Null
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $process = $null
          $serviceLog = Join-Path $dataDir "logs\service.log"
          . (Join-Path $PSScriptRoot 'scripts/stop-windows-process-tree.ps1')
          function Stop-Tree {
            if ($null -ne $process -and !$process.HasExited) { Stop-OwnedProcessTree -Root $process }
          }
          function Show-Logs {
            Get-ChildItem -LiteralPath $dataDir -Recurse -Filter '*.log' | ForEach-Object {
              Write-Output $_.FullName
              Protect-WindowsSmokeText -Text ([IO.File]::ReadAllText($_.FullName)) -Secrets $diagnosticSecrets
            }
          }
          function Wait-Ready([string] $defect) {
            $ready = $false
            $timer = [Diagnostics.Stopwatch]::StartNew()
            try {
              while ($timer.Elapsed.TotalSeconds -lt 120) {
                if ((Test-Path $serviceLog) -and (Select-String -LiteralPath $serviceLog -SimpleMatch 'names no version' -Quiet)) {
                  throw "${defect}: launcher-entry version check (#1382): service log holds names no version"
                }
                if ($null -ne $process -and $process.HasExited) { throw "$defect exited with $($process.ExitCode) before readiness" }
                $discovery = $null
                try {
                  $discovery = Invoke-RestMethod -Uri "http://127.0.0.1:$port/.well-known/agent-harness/environment" -TimeoutSec 2
                  $lastDiscovery = $discovery
                  $lastRequestError = ''
                } catch { $lastRequestError = $_.Exception.Message }
                if ($discovery.harnessVersion -eq $env:VERSION -and $discovery.readiness -eq "ready") {
                  $ready = $true
                  Write-Output "$defect ready with release version $env:VERSION"
                  return
                }
                Start-Sleep -Milliseconds 500
              }
              throw "$defect failed to become ready with release version $env:VERSION within 120 seconds"
            } finally {
              if (!$ready) {
                # Capture while the task, process tree, port and data still exist.
                $evidence = Join-Path $diagnostics ($defect -replace '[^a-zA-Z0-9_-]', '-')
                Save-WindowsSmokeDiagnostics -OutputDirectory $evidence -DataDirectory $dataDir -Stage $defect -Port $port -Version $env:VERSION -StartedAt $smokeStartedAt -LastDiscovery $lastDiscovery -LastRequestError $lastRequestError -Secrets $diagnosticSecrets
              }
            }
          }
          try {
            foreach ($attempt in 1, 2) {
              $defect = if ($attempt -eq 1) { 'first start' } else { 'second start/keychain read (#1381)' }
              $process = Start-Process -FilePath $node -ArgumentList "`"$cli`" serve --data-dir `"$dataDir`" --port $port" -PassThru -RedirectStandardOutput (Join-Path $dataDir "start-$attempt.log") -RedirectStandardError (Join-Path $dataDir "start-$attempt-error.log")
              Wait-Ready $defect
              & $node scripts/check-packaged-extension.mjs $server $dataDir $env:VERSION
              if ($LASTEXITCODE -ne 0) { throw 'Packaged browser extension check failed' }
              Stop-Tree
              $process = $null
            }
            # Bound the first copy into versions, including service registration, to 90 seconds.
            $stagingLimitSeconds = 90
            $stagingTimer = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process -FilePath $node -ArgumentList "`"$cli`" service install --data-dir `"$dataDir`" --port $port" -PassThru -RedirectStandardOutput (Join-Path $dataDir "staging.log") -RedirectStandardError (Join-Path $dataDir "staging-error.log")
            if (!$process.WaitForExit($stagingLimitSeconds * 1000) -or $stagingTimer.Elapsed.TotalSeconds -gt $stagingLimitSeconds) {
              throw "Windows staging (#1383) exceeded the $stagingLimitSeconds-second bound"
            }
            $stagingTimer.Stop()
            Write-Output "Windows staging took $($stagingTimer.Elapsed.TotalSeconds) seconds (bound: $stagingLimitSeconds seconds)"
            if ($process.ExitCode -ne 0) { throw "Windows staging (#1383) exited with $($process.ExitCode)" }
            $process = $null
            # Exercise the LF-only pointer written by install, without Task Scheduler's interactive-token requirement.
            [IO.File]::WriteAllText((Join-Path $dataDir "launcher-version"), "$env:VERSION`n", [Text.UTF8Encoding]::new($false))
            $entry = Join-Path $dataDir "launcher-entry.cmd"
            $process = Start-Process -FilePath $env:ComSpec -ArgumentList ('/d /s /c ""{0}""' -f $entry) -WorkingDirectory $dataDir -PassThru -RedirectStandardOutput (Join-Path $dataDir "entry.log") -RedirectStandardError (Join-Path $dataDir "entry-error.log")
            Wait-Ready 'launcher-entry version check (#1382) and launcher start'
            if ((Test-Path $serviceLog) -and (Select-String -LiteralPath $serviceLog -SimpleMatch 'names no version' -Quiet)) {
              throw 'launcher-entry version check (#1382): service log holds "names no version"'
            }
          } catch {
            Save-WindowsSmokeDiagnostics -OutputDirectory (Join-Path $diagnostics 'startup-failure') -DataDirectory $dataDir -Stage 'direct startup or staging' -Port $port -Version $env:VERSION -StartedAt $smokeStartedAt -LastDiscovery $lastDiscovery -LastRequestError $_.Exception.Message -Secrets $diagnosticSecrets
            Show-Logs
            throw
          } finally {
            try { Stop-Tree } finally {
              $process = $null
              $ownedHandles = @()
              $unrelated = $null
              try {
                # The parent granted the fixture user a batch logon, so change only the task
                # principal to Password; keep the installed conhost/cmd action and limited token.
                $passwordFile = Join-Path $PSScriptRoot 'task-password.txt'
                $task = Get-ScheduledTask -TaskName agent-harness
                $task.Principal.LogonType = 'Password'
                try {
                  Register-ScheduledTask -InputObject $task -User "$env:USERDOMAIN\$env:USERNAME" -Password ([IO.File]::ReadAllText($passwordFile)) -Force | Out-Null
                } finally { Remove-Item -LiteralPath $passwordFile -Force }
                Start-ScheduledTask -TaskName agent-harness
                Wait-Ready 'scheduled-task start before uninstall (#1478)'
                # Keep native handles so PID reuse cannot make the exit checks lie.
                $rows = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$dataDir\versions\*\node\node.exe" })
                if ($rows.Count -lt 2) { throw 'The scheduled task did not start its launcher and server' }
                foreach ($row in $rows) {
                  $handle = Get-Process -Id $row.ProcessId
                  $null = $handle.SafeHandle
                  if ($handle.StartTime.ToUniversalTime().ToString('yyyyMMddHHmmssffffff') -ne $row.CreationDate.ToUniversalTime().ToString('yyyyMMddHHmmssffffff')) { throw 'The scheduled task process identity changed before uninstall' }
                  $ownedHandles += $handle
                }
                # A live executable inside the app directory would prevent NSIS from removing it.
                $unrelatedNode = Join-Path $PSScriptRoot 'unrelated-node.exe'
                Copy-Item -LiteralPath $node -Destination $unrelatedNode
                $unrelated = Start-Process -FilePath $unrelatedNode -ArgumentList '-e "setInterval(() => {}, 1000)"' -WindowStyle Hidden -PassThru
                $null = $unrelated.SafeHandle
                # Exercise cleanup with the scheduled-task tree still serving, without
                # a preceding Stop-Tree or CLI uninstall.
                $personalData = Join-Path $dataDir 'uninstall-retention-check.txt'
                [IO.File]::WriteAllText($personalData, 'Personal data stays until the user removes it.')
                $appDir = Split-Path (Split-Path $server -Parent) -Parent
                $uninstaller = Join-Path $appDir "Uninstall agent-harness.exe"
                # _?= keeps NSIS in this process so -Wait observes cleanup and its exit code.
                $uninstall = Start-Process -FilePath $uninstaller -ArgumentList ('/S _?={0}' -f $appDir) -Wait -PassThru
                if ($uninstall.ExitCode -ne 0) { throw "Desktop uninstall exited with $($uninstall.ExitCode)" }
                foreach ($handle in $ownedHandles) {
                  if (!$handle.HasExited) { throw 'Desktop uninstall left an owned process running' }
                }
                if ($unrelated.HasExited) { throw 'Desktop uninstall stopped an unrelated Node process' }
                $probe = [Net.Sockets.TcpClient]::new()
                try {
                  try { $probe.Connect('127.0.0.1', $port) } catch [Net.Sockets.SocketException] { }
                  if ($probe.Connected) { throw 'Desktop uninstall left the environment port open' }
                } finally { $probe.Dispose() }
                if (Get-ScheduledTask -TaskName agent-harness -ErrorAction SilentlyContinue) { throw 'Desktop uninstall left the environment task registered' }
                if (!(Test-Path $personalData)) { throw 'Desktop uninstall deleted personal environment data' }
                foreach ($file in 'launcher-entry.cmd', 'bin\agent-harness.cmd', 'service.json') {
                  if (Test-Path (Join-Path $dataDir $file)) { throw 'Desktop uninstall left service launch scripts behind' }
                }
                if (Test-Path $server) { throw 'Desktop uninstall left app resources behind' }
                # _?= deliberately leaves the running uninstaller itself; the fixture removes it.
                if (Test-Path $appDir) { Remove-Item -LiteralPath $appDir -Recurse -Force }
              } catch {
                Save-WindowsSmokeDiagnostics -OutputDirectory (Join-Path $diagnostics 'scheduled-task-or-uninstall-failure') -DataDirectory $dataDir -Stage 'scheduled-task start or uninstall' -Port $port -Version $env:VERSION -StartedAt $smokeStartedAt -LastDiscovery $lastDiscovery -LastRequestError $_.Exception.Message -Secrets $diagnosticSecrets
                throw
              } finally {
                # Failure cleanup runs after the assertions, preserving their evidence.
                foreach ($handle in $ownedHandles) {
                  try { if (!$handle.HasExited) { $handle.Kill(); $handle.WaitForExit() } } finally { $handle.Dispose() }
                }
                if ($null -ne $unrelated) {
                  try { if (!$unrelated.HasExited) { $unrelated.Kill(); $unrelated.WaitForExit() } } finally { $unrelated.Dispose() }
                }
                if (Get-ScheduledTask -TaskName agent-harness -ErrorAction SilentlyContinue) {
                  Stop-ScheduledTask -TaskName agent-harness
                  Unregister-ScheduledTask -TaskName agent-harness -Confirm:$false
                }
              }
              Remove-Item -LiteralPath $dataDir -Recurse -Force
            }
          }
          exit 0
          '@
            $script = Join-Path $work 'smoke.ps1'
            [IO.File]::WriteAllText($script, $smoke, [Text.UTF8Encoding]::new($false))
            & icacls.exe $work /grant ('*{0}:(OI)(CI)F' -f $account.SID.Value) /T | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Could not grant the smoke user access to its fixture' }
            # Pass the temporary account password through an ACL-restricted file,
            # never through process arguments or logs. The child deletes it after registration.
            $passwordFile = Join-Path $work 'task-password.txt'
            [IO.File]::WriteAllText($passwordFile, $credential.GetNetworkCredential().Password)
            & icacls.exe $passwordFile /inheritance:r /grant:r ('*{0}:F' -f $account.SID.Value) '*S-1-5-18:F' '*S-1-5-32-544:F' | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'Could not protect the task registration credential' }
            $stdout = Join-Path $work 'stdout.log'
            $stderr = Join-Path $work 'stderr.log'
            $arguments = '-NoProfile -NonInteractive -File "{0}" -Version "{1}"' -f $script, $env:VERSION
            $child = Start-Process -FilePath (Join-Path $PSHOME 'pwsh.exe') -ArgumentList $arguments -Credential $credential -LoadUserProfile -UseNewEnvironment -WorkingDirectory $work -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
            Protect-WindowsSmokeText -Text ([IO.File]::ReadAllText($stdout)) -Secrets $diagnosticSecrets | Out-Host
            Protect-WindowsSmokeText -Text ([IO.File]::ReadAllText($stderr)) -Secrets $diagnosticSecrets | Out-Host
            if ($child.ExitCode -ne 0) { throw "Ordinary-user smoke exited with $($child.ExitCode)" }
          } finally {
            # Retain only sanitized evidence before deleting the user and fixture.
            $childDiagnostics = Join-Path $work 'diagnostics'
            try {
              if (Test-Path $childDiagnostics) {
                foreach ($file in (Get-ChildItem -LiteralPath $childDiagnostics -Recurse -File)) {
                  try {
                    $relative = [IO.Path]::GetRelativePath($childDiagnostics, $file.FullName)
                    Copy-WindowsSmokeEvidenceFile -Source $file.FullName -Destination (Join-Path $diagnostics $relative) -Secrets $diagnosticSecrets
                  } catch {
                    Write-WindowsSmokeCollectionError -Path (Join-Path $diagnostics 'diagnostic-copy.error.txt') -Message $_.Exception.Message -Secrets $diagnosticSecrets
                  }
                }
              }
            } catch {
              Write-WindowsSmokeCollectionError -Path (Join-Path $diagnostics 'diagnostic-list.error.txt') -Message $_.Exception.Message -Secrets $diagnosticSecrets
            }
            foreach ($name in 'stdout.log', 'stderr.log') {
              Copy-WindowsSmokeEvidenceFile -Source (Join-Path $work $name) -Destination (Join-Path $diagnostics $name) -Secrets $diagnosticSecrets
            }
            # The ordinary user may not read Operational; collect the task-scoped
            # events with the runner account as well, without elevating the smoke.
            try {
              $events = ConvertTo-Json -InputObject @(Get-WindowsSmokeTaskEvents -StartedAt $smokeStartedAt) -Depth 12
              Write-WindowsSmokeText -Path (Join-Path $diagnostics 'runner-task-events.json') -Text $events -Secrets $diagnosticSecrets
            } catch {
              Write-WindowsSmokeCollectionError -Path (Join-Path $diagnostics 'runner-task-events.error.txt') -Message $_.Exception.Message -Secrets $diagnosticSecrets
            }
            try {
              try {
                if ($batchLogon) { Revoke-WindowsLogonRight -Sid $account.SID.Value -Right SeBatchLogonRight }
              } finally {
                if ($created) { Remove-LocalUser -Name $user }
              }
            } finally {
              if (Test-Path $work) { Remove-Item -LiteralPath $work -Recurse -Force }
              $password.Dispose()
            }
          }

      - name: Keep Windows smoke failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-smoke-diagnostics
          path: windows-smoke-diagnostics
          if-no-files-found: error

  smoke-macos:
    needs: [prepare, desktop-macos]
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: desktop-darwin-arm64
          path: desktop
      - name: Resolve a public headless install without credentials
        run: |
          set -euo pipefail
          unset AGENT_HARNESS_TOKEN
          plan=$(sh scripts/install.sh --dry-run --data-dir "$RUNNER_TEMP/headless-install")
          printf '%s\n' "$plan"
          grep -q 'https://github.com/david-systemtech/agent-harness/releases/download/' <<< "$plan"
          if grep -Eq 'AGENT_HARNESS_TOKEN|Authorization|/api/v1/repos/' <<< "$plan"; then exit 1; fi
      - name: Run the unpacked server with its own Node
        run: |
          set -euo pipefail
          ditto -x -k desktop/agent-harness-desktop-darwin-arm64.zip unzipped
          codesign --verify --deep --strict "unzipped/agent-harness.app"
          server=unzipped/agent-harness.app/Contents/Resources/server
          test -f "$server/node_modules/@agent-harness/contracts/package.json"
          "$server/node/bin/node" scripts/check-packaged-update-disk.mjs "$server"
          "$server/node/bin/node" scripts/check-packaged-provider-sign-in.mjs "$server"
          test "$("$server/node/bin/node" "$server/packages/cli/dist/main.js" --version)" = "agent-harness $VERSION"
          code=0
          status=$("$server/node/bin/node" "$server/packages/cli/dist/main.js" service status 2>&1) || code=$?
          printf '%s\n' "$status"
          test "$code" -eq 3
          grep -q 'No service is installed' <<< "$status"

      - name: Verify native screenshot diagnostics
        run: |
          server=unzipped/agent-harness.app/Contents/Resources/server
          "$server/node/bin/node" --test scripts/macos-smoke-diagnostics-native.test.mjs

      - name: Verify packaged macOS tunnel ownership
        run: |
          set -euo pipefail
          server=unzipped/agent-harness.app/Contents/Resources/server
          SERVER="$server" "$server/node/bin/node" --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          const { tailscaleDetector, bindPlan } = await import(pathToFileURL(resolve(process.env.SERVER, "node_modules/@agent-harness/environment/dist/serve/interfaces.js")));
          const entry = (address) => ({ address, internal: false, family: address.includes(":") ? "IPv6" : "IPv4" });
          let interfaces = { utun0: [entry("100.64.0.8")], utun4: [entry("100.64.0.9"), entry("fd7a:115c:a1e0::1")] };
          let state;
          const detector = tailscaleDetector(async (_command, args) =>
            args[0] === "status" && state ? JSON.stringify({ BackendState: state }) : undefined,
            () => interfaces, { platform: "darwin", readInstalled: () => true });
          assert.equal(await detector.tailscaleAddress(), "100.64.0.9");
          assert.equal(await detector.tailnetName(), undefined);
          for (state of ["Stopped", "NeedsLogin"]) {
            assert.equal(await detector.tailscaleAddress(), undefined);
          }
          state = undefined;
          interfaces = { utun0: [entry("100.64.0.8")] };
          const tailscaleAddress = await detector.tailscaleAddress();
          assert.equal(tailscaleAddress, undefined);
          assert.equal(detector.tailscaleInstalled(), true);
          assert.deepEqual(bindPlan({ tailscaleAddress }).binds, [{ host: "127.0.0.1", interface: "loopback" }]);
          NODE

      - name: Start the packaged environment twice
        run: |
          set -euo pipefail
          # Each foreground serve owns a process group, including any children it starts.
          set -m
          server=unzipped/agent-harness.app/Contents/Resources/server
          node="$server/node/bin/node"
          cli="$server/packages/cli/dist/main.js"
          data_dir=$(mktemp -d)
          pid=
          stop_environment() {
            if [ -n "$pid" ]; then
              kill -TERM -- "-$pid" 2>/dev/null || true
              for tick in {1..100}; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 0.1
              done
              kill -KILL -- "-$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              pid=
            fi
          }
          cleanup() {
            result=$?
            trap - EXIT
            stop_environment
            if ! "$node" "$cli" service uninstall --data-dir "$data_dir"; then result=1; fi
            rm -rf "$data_dir"
            exit "$result"
          }
          trap cleanup EXIT
          port=$("$node" -e 'const s = require("node:net").createServer(); s.listen(0, "127.0.0.1", () => { console.log(s.address().port); s.close(); });')
          for attempt in 1 2; do
            defect="first start"
            if [ "$attempt" -eq 2 ]; then defect="second start/keychain read (#1381)"; fi
            "$node" "$cli" serve --data-dir "$data_dir" --port "$port" > "$data_dir/start-$attempt.log" 2>&1 &
            pid=$!
            ready=false
            for tick in {1..120}; do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              if curl --fail --silent --max-time 2 "http://127.0.0.1:$port/.well-known/agent-harness/environment" > "$data_dir/discovery.json" &&
                "$node" -e 'const discovery = require(process.argv[1]); if (discovery.harnessVersion !== process.env.VERSION || discovery.readiness !== "ready") process.exit(1);' "$data_dir/discovery.json"; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              cat "$data_dir/start-$attempt.log"
              echo "::error::$defect failed to become ready with release version $VERSION"
              exit 1
            fi
            echo "$defect ready with release version $VERSION"
            "$node" scripts/check-packaged-extension.mjs "$server" "$data_dir" "$VERSION"
            stop_environment
          done

      - name: Replace the packaged desktop with an existing client credential
        env:
          SMOKE_DIAGNOSTICS: ${{ runner.temp }}/macos-update-diagnostics
        run: |
          set -euo pipefail
          server=unzipped/agent-harness.app/Contents/Resources/server
          "$server/node/bin/node" scripts/macos-desktop-update-smoke.mjs "unzipped/agent-harness.app"

      - name: Keep macOS timeout diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-update-diagnostics
          path: ${{ runner.temp }}/macos-update-diagnostics
          retention-days: 7
          if-no-files-found: error

