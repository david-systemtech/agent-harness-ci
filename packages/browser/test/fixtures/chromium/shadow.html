<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dashboard</title></head>
<body>
  <!-- A Lit-style card: everything it shows is in an open shadow root, its title slotted in from the light DOM. -->
  <climate-card><span slot="title">Living room</span></climate-card>
  <script>
    customElements.define("climate-card", class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" }).innerHTML = '<h2><slot name="title"></slot></h2><div class="state">21.5 °C</div>';
      }
    });
  </script>
</body>
</html>
