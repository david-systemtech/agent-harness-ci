<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>A long article</title><style>p { margin: 0 0 16px; line-height: 24px; }</style></head>
<body>
  <article id="article"><h1>A long article</h1></article>
  <script>
    const article = document.getElementById("article");
    for (let n = 1; n <= 300; n++) {
      const p = document.createElement("p");
      p.textContent = `Paragraph ${n} of the article, which runs far past the first screen.`;
      article.append(p);
    }
    const last = document.createElement("p");
    last.textContent = "The end of the article.";
    article.append(last);
  </script>
</body>
</html>
