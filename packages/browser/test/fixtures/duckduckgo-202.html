<!-- #292's DuckDuckGo challenge: html.duckduckgo.com/html/ for a query, 202 with its duck-picture challenge, as it served curl on 2026-09-29 (measured 2026-09-28). Trimmed to three of its nine tiles, ids and values faked. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="canonical" href="https://duckduckgo.com/">
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=1">
    <title>
        DuckDuckGo
    </title>
    <link rel="stylesheet" media="handheld, all" href="//duckduckgo.com/dist/l.file-for-tests.css" type="text/css"/>
</head>
<body>
    <a name="top"></a>
    <center id="lite_wrapper">
        <br>
        <a class="header-url" href="/html/">
            <span class="header">DuckDuckGo</span>
        </a>
        <br><br>
        <iframe name="ifr" width="0" height="0" border="0" class="hidden"></iframe>
        <form id="img-form" action="//duckduckgo.com/anomaly.js?sv=html&cc=sre&ti=1&gk=gk-for-tests&q=playwright aria snapshot&r=ase" target="ifr" method="POST"></form>
        <form id="challenge-form" action="//duckduckgo.com/anomaly.js?sv=html&cc=sre&st=1&gk=gk-for-tests&q=playwright aria snapshot&r=ase" method="POST">
            <div class="anomaly-modal__mask">
                <div class="anomaly-modal__modal  is-ie" data-testid="anomaly-modal">
                    <div class="anomaly-modal__title">Unfortunately, bots use DuckDuckGo too.</div>
                    <div class="anomaly-modal__description">Please complete the following challenge to confirm this search was made by a human.</div>
                    <div class="anomaly-modal__instructions">Select all squares containing a duck:</div>
                    <div class="anomaly-modal__puzzle-margins">
                        <div class="anomaly-modal__puzzle">
                            <div class="anomaly-modal__box" data-index="0">
                                <label class="" for="image-check_tile-0" data-testid="anomaly-modal-tile-0">
                                    <input type="checkbox" class="anomaly-modal__check" name="image-check_tile-0" id="image-check_tile-0">
                                    <img class="anomaly-modal__image" alt=" " id="image-tile-0" src="../assets/anomaly/images/challenge/tile-0.jpg" data-testid="anomaly-modal-image-0"></img>
                                </label>
                            </div>
                            <div class="anomaly-modal__box" data-index="1">
                                <label class="" for="image-check_tile-1" data-testid="anomaly-modal-tile-1">
                                    <input type="checkbox" class="anomaly-modal__check" name="image-check_tile-1" id="image-check_tile-1">
                                    <img class="anomaly-modal__image" alt=" " id="image-tile-1" src="../assets/anomaly/images/challenge/tile-1.jpg" data-testid="anomaly-modal-image-1"></img>
                                </label>
                            </div>
                            <div class="anomaly-modal__box" data-index="2">
                                <label class="" for="image-check_tile-2" data-testid="anomaly-modal-tile-2">
                                    <input type="checkbox" class="anomaly-modal__check" name="image-check_tile-2" id="image-check_tile-2">
                                    <img class="anomaly-modal__image" alt=" " id="image-tile-2" src="../assets/anomaly/images/challenge/tile-2.jpg" data-testid="anomaly-modal-image-2"></img>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="anomaly-modal__controls">
                        <button name="challenge-submit" class="btn btn--primary anomaly-modal__submit js-anomaly-modal-submit" form="challenge-form" value="gk-for-tests" >Submit</button>
                        <p></p>
                        <input class="feedback-toggle" type="checkbox" id="feedback" unchecked />
                        <label for="feedback" class="feedback-text">Images not loading?</label>
                        <div class="feedback-content">
                            <label class="feedback-instructions">Please email the following code to:</label>
                            <p class="feedback-instructions">error-lite+code@duckduckgo.com</p>
                            <p><label class="feedback-instructions">Code: code</label></p>
                        </div>
                    </div>
            </div>
        </form>
        <br>
        <p class='html-only'>
            <!--    This is the Lite version. Get the full-JS version <a href="https://duckduckgo.com/">here</a>. //-->
        </p>
    </center>
    <img src="//duckduckgo.com/t/tqadb?s=lite&amp;gk=gk-for-tests&amp;r=ase"/>
</body>
</html>
